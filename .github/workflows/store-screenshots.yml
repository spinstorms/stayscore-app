name: Store screenshots (save into the repo)
# Screenshots are taken on a Mac simulator elsewhere and uploaded as a zip; this saves them here.
on:
  push:
    branches: [store-screenshots]
    paths: [store/screenshot-url.txt]
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          URL=$(head -1 store/screenshot-url.txt)
          curl -fsSL "$URL" -o shots.tgz
          mkdir -p tmp && tar -xzf shots.tgz -C tmp
          rm -rf store/screenshots/ios && mkdir -p store/screenshots
          cp -r tmp/shots store/screenshots/ios
          find store/screenshots -name "*.png" | sort
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/screenshots && git commit -m "Store screenshots (iPhone 6.9in, iPad 13in)" && git push || echo nothing
